
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Home - SafeGuard Insurance</title>
  <meta name="description" content="Reliable insurance plans designed to safeguard your life, health, and assets with personalized care and trusted support.">
  <meta name="keywords" content="insurance, health insurance, vehicle insurance, property insurance, claims, fraud detection">

  <link href="/static/assets/img/favicon.png" rel="icon">
  <link href="/static/assets/img/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,500;1,600;1,700;1,800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="/static/assets/vendor/aos/aos.css" rel="stylesheet">
  <link href="/static/assets/vendor/glightbox/css/glightbox.min.css" rel="stylesheet">
  <link href="/static/assets/vendor/swiper/swiper-bundle.min.css" rel="stylesheet">

  <!-- Main CSS File -->
  <link href="/static/assets/css/main.css" rel="stylesheet">

  <style>
    /* Global Styles */
    body {
      font-family: 'Open Sans', sans-serif;
      color: #333;
      background: #f8f9fa;
    }

    /* Header */
    .header {
      background: rgba(55, 81, 126, 0.9);
      backdrop-filter: blur(10px);
      padding: 15px 0;
      transition: all 0.3s ease;
    }

    .header .logo h1 {
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 24px;
      font-weight: 600;
      margin: 0;
    }

    .navmenu ul li a {
      color: #fff;
      font-size: 16px;
      font-weight: 500;
      position: relative;
      transition: color 0.3s ease;
    }

    .navmenu ul li a:hover,
    .navmenu ul li a.active {
      color: #00C4B4;
    }

    .navmenu ul li a::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      bottom: -2px;
      left: 0;
      background: #00C4B4;
      transition: width 0.3s ease;
    }

    .navmenu ul li a:hover::after,
    .navmenu ul li a.active::after {
      width: 100%;
    }

    .btn-getstarted {
      background: linear-gradient(45deg, #37517e, #00C4B4);
      color: #fff;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .btn-getstarted::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.5s;
    }

    .btn-getstarted:hover::before {
      left: 100%;
    }

    .btn-getstarted:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 196, 180, 0.4);
    }

    /* Hero Section */
    .hero.dark-background {
      background: linear-gradient(rgba(55, 81, 126, 0.7), rgba(0, 196, 180, 0.7)), url('https://images.unsplash.com/photo-1450101499163-c8848c66ca85') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 15px;
      position: relative;
      overflow: hidden;
    }

    .hero .content-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 30px;
      max-width: 800px;
      margin: 0 auto;
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .hero .content-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
    }

    .hero h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 36px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 16px;
      color: #fff;
      opacity: 0.9;
      margin-bottom: 30px;
    }

    .hero .btn-get-started {
      background: linear-gradient(45deg, #37517e, #00C4B4);
      padding: 12px 24px;
      font-size: 14px;
      border-radius: 10px;
      transition: all 0.3s ease;
    }

    .floating-icons {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      top: 0;
      left: 0;
    }

    .floating-icon {
      position: absolute;
      opacity: 0.15;
      color: #fff;
      animation: float 8s ease-in-out infinite, rotate 12s linear infinite;
    }

    .floating-icon:nth-child(1) { top: 10%; left: 10%; font-size: 60px; animation-delay: 0s; }
    .floating-icon:nth-child(2) { top: 50%; right: 15%; font-size: 50px; animation-delay: 2s; }
    .floating-icon:nth-child(3) { bottom: 20%; left: 20%; font-size: 45px; animation-delay: 4s; }
    .floating-icon:nth-child(4) { top: 70%; right: 25%; font-size: 55px; animation-delay: 6s; }
    .floating-icon:nth-child(5) { bottom: 10%; left: 30%; font-size: 50px; animation-delay: 1s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-25px) scale(1.1); }
    }

    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Clients Section */
    .clients.section {
      padding: 40px 15px;
      background: #fff;
    }

    .client-card {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .client-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
    }

    .client-card img {
      max-width: 100px;
      height: auto;
      opacity: 0.8;
      transition: opacity 0.3s ease;
    }

    .client-card:hover img {
      opacity: 1;
    }

    /* About Section */
    .about.section {
      padding: 40px 15px;
    }

    .section-title h2 {
      font-family: 'Poppins', sans-serif;
      font-size: 28px;
      color: #37517e;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .about .content-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 15px;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .about .content-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
    }

    .about p {
      font-size: 16px;
      color: #333;
      margin-bottom: 15px;
    }

    .about ul li {
      font-size: 16px;
      color: #333;
      margin-bottom: 10px;
    }

    .about ul li i {
      color: #00C4B4;
      margin-right: 10px;
    }

    /* Call to Action Section */
    .call-to-action.section {
      background: linear-gradient(135deg, #37517e 0%, #5a7ab5 50%, #00C4B4 100%);
      padding: 40px 15px;
      position: relative;
      overflow: hidden;
      animation: gradientShift 15s ease infinite;
      background-size: 200% 200%;
    }

    .call-to-action .content-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 15px;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .call-to-action .content-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
    }

    .call-to-action h3 {
      font-family: 'Poppins', sans-serif;
      font-size: 24px;
      color: #fff;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .call-to-action p {
      font-size: 16px;
      color: #fff;
      opacity: 0.9;
    }

    /* Footer */
    .footer {
      background: #37517e;
      padding: 40px 0;
      color: #fff;
    }

    .footer .sitename {
      font-family: 'Poppins', sans-serif;
      font-size: 20px;
      font-weight: 600;
    }

    .footer .footer-contact p {
      font-size: 14px;
      margin-bottom: 10px;
    }

    .footer .footer-links h4 {
      font-size: 16px;
      color: #F4C430;
      margin-bottom: 15px;
    }

    .footer .footer-links ul li a {
      color: #fff;
      font-size: 14px;
      transition: color 0.3s ease;
    }

    .footer .footer-links ul li a:hover {
      color: #00C4B4;
    }

    .footer .social-links a {
      color: #fff;
      font-size: 18px;
      margin-right: 15px;
      transition: transform 0.3s ease, color 0.3s ease;
    }

    .footer .social-links a:hover {
      color: #00C4B4;
      transform: rotate(360deg);
    }

    .footer .copyright p {
      font-size: 14px;
      color: #fff;
      opacity: 0.8;
    }

    .footer .copyright .sitename {
      color: #F4C430;
    }

    /* Scroll Top */
    .scroll-top {
      background: #00C4B4;
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      transition: all 0.3s ease;
    }

    .scroll-top:hover {
      background: #009688;
      transform: translateY(-5px);
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .hero, .about, .call-to-action {
        padding: 20px 10px;
      }

      .hero h1 {
        font-size: 28px;
      }

      .section-title h2 {
        font-size: 24px;
      }

      .call-to-action h3 {
        font-size: 20px;
      }

      .floating-icon {
        font-size: 35px !important;
      }

      .hero .content-card,
      .about .content-card,
      .call-to-action .content-card {
        max-width: 100%;
      }

      .footer .row {
        flex-direction: column;
        gap: 20px;
      }
    }
  </style>
</head>
