
<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Policy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Dark section background styling */
        .hero.dark-background {
            background: linear-gradient(135deg, #37517e, #2b3d6e);
            min-height: 100vh;
            padding: 60px 0; /* increased padding for top & bottom breathing space */
            color: white;
        }

        /* Push content down below navbar */
        .page-content {
            margin-top: 30px; /* space below nav */
        }

        /* Card styling */
        .form-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 30px;
            max-width: 700px;
            margin: auto;
        }

        .form-label {
            font-weight: 600;
            color: #37517e;
        }

        .btn-submit {
            background: #37517e;
            color: white;
            border-radius: 8px;
            padding: 10px 20px;
        }
        .btn-submit:hover {
            background: #2b3d6e;
        }
    </style>
</head>
<body>

{% include 'company_public_header.html' %}

<section class="hero section dark-background page-content">
    <div class="container">
        <div class="form-card">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="mb-0"><i class="fas fa-plus me-2"></i>Add New Policy</h3>
                <a href="{% url 'company_manage_policy' %}" class="btn btn-secondary btn-sm">
                    <i class="fas fa-arrow-left"></i> Back
                </a>
            </div>

            <form method="POST" class="needs-validation" novalidate>
                {% csrf_token %}

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Policy Name <span class="text-danger">*</span></label>
                        <input type="text" name="name" class="form-control" placeholder="Enter policy name" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Policy Type <span class="text-danger">*</span></label>
                        <input type="text" name="type" class="form-control" placeholder="Enter policy type" required>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Coverage Details</label>
                        <textarea name="coverage_details" class="form-control" rows="3" placeholder="Enter coverage details"></textarea>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Premium Amount <span class="text-danger">*</span></label>
                        <input type="number" step="0.01" name="premium_amount" class="form-control" placeholder="Enter premium amount" required>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Terms & Conditions</label>
                        <textarea name="terms_and_conditions" class="form-control" rows="4" placeholder="Enter terms and conditions"></textarea>
                    </div>
                </div>

                <div class="text-end mt-4">
                    <button type="submit" class="btn btn-submit">
                        <i class="fas fa-save me-1"></i> Save Policy
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>

{% include 'public_footer.html' %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Bootstrap validation
    (function () {
        'use strict'
        var forms = document.querySelectorAll('.needs-validation')
        Array.prototype.slice.call(forms).forEach(function (form) {
            form.addEventListener('submit', function (event) {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }
                form.classList.add('was-validated')
            }, false)
        })
    })()
</script>

</body>
</html>
